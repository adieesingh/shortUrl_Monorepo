name: Deployment
on:
  push:
    branch:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Code
        uses: action/checkout@v6


      - name: Deploy a VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          hosts: {{ secrets.SSH_HOST }}
          username: ubuntu
          key: {{secrets.SSH_KEY }}
          script: |
              cd /home/ubuntu/shortUrlGenerate/shortUrl_Monorepo
              git fetch
              git pull origin main
              pnpm install
              pnpm run build
              pm2 restart urlgenerator || pm2 start pnpm --name urlgenerator 
              sudo nginx -s reload
          